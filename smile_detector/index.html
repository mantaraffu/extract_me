<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emotionscript</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view"></canvas>

<aside id="panel">
  <h1>emotionscript</h1>
  <div id="status">starting...</div>

  <label>source
    <select id="source"></select>
  </label>
  <input id="file" type="file" accept="video/*,image/*" hidden>

  <div class="row">
    <label><input id="mirror" type="checkbox" checked> mirror</label>
    <label><input id="overlay" type="checkbox" checked> overlay</label>
  </div>

  <fieldset>
    <legend><label><input id="blink" type="checkbox" checked> blink</label></legend>
    <label>mode
      <select id="blinkMode">
        <option value="blend">blendshape (eyeBlink)</option>
        <option value="ear">EAR (landmarks)</option>
      </select>
    </label>
    <label>threshold <input id="blinkThresh" type="number" step="0.01" min="0" max="1" placeholder="0.5"></label>
  </fieldset>

  <fieldset>
    <legend><label><input id="hands" type="checkbox"> hands → video window between the palms</label></legend>
    <label><input id="handsHold" type="checkbox"> lock the rect on appearance</label>
    <label><input id="handsResetOn" type="checkbox"> reset every <input id="handsReset" type="number" step="1" min="1" value="15"> s</label>
  </fieldset>

  <fieldset>
    <legend>emotion</legend>
    <label>source
      <select id="emotion">
        <option value="blend">blendshape (heuristic, free)</option>
        <option value="vit">ViT (transformers.js, 90–350MB once)</option>
        <option value="off">off</option>
      </select>
    </label>
    <label>ViT every <input id="vitEvery" type="number" step="1" min="1" value="3"> frames</label>
  </fieldset>

  <pre id="stats"></pre>
  <div id="bars"></div>

  <p class="hint">keys: <b>h</b> panel · <b>o</b> overlay · <b>m</b> mirror · <b>f</b> fullscreen · <b>r</b> reset rect<br>
  drag a video or an image onto the page to use it as the source.<br>
  per-frame state in <code>window.emotionState</code> and the <code>emotionscript</code> event.</p>
</aside>

<script type="module" src="js/app.js"></script>
</body>
</html>
