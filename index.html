<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emotionscript</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view"></canvas>

<aside id="panel">
  <h1>emotionscript</h1>
  <div id="status">avvio...</div>

  <label>sorgente
    <select id="source"></select>
  </label>
  <input id="file" type="file" accept="video/*,image/*" hidden>

  <div class="row">
    <label><input id="mirror" type="checkbox" checked> specchia</label>
    <label><input id="overlay" type="checkbox" checked> overlay</label>
  </div>

  <fieldset>
    <legend><label><input id="blink" type="checkbox" checked> blink</label></legend>
    <label>modo
      <select id="blinkMode">
        <option value="blend">blendshape (eyeBlink)</option>
        <option value="ear">EAR (landmark)</option>
      </select>
    </label>
    <label>soglia <input id="blinkThresh" type="number" step="0.01" min="0" max="1" placeholder="0.5"></label>
  </fieldset>

  <fieldset>
    <legend><label><input id="hands" type="checkbox"> mani → finestra video tra i palmi</label></legend>
    <label><input id="handsHold" type="checkbox"> blocca il rect alla comparsa</label>
    <label><input id="handsResetOn" type="checkbox"> reset ogni <input id="handsReset" type="number" step="1" min="1" value="15"> s</label>
  </fieldset>

  <fieldset>
    <legend>emotion</legend>
    <label>sorgente
      <select id="emotion">
        <option value="blend">blendshape (euristica, gratis)</option>
        <option value="vit">ViT (transformers.js, 90–350MB una volta)</option>
        <option value="off">off</option>
      </select>
    </label>
    <label>ViT ogni <input id="vitEvery" type="number" step="1" min="1" value="3"> frame</label>
  </fieldset>

  <pre id="stats"></pre>
  <div id="bars"></div>

  <p class="hint">tasti: <b>h</b> pannello · <b>o</b> overlay · <b>m</b> specchio · <b>f</b> schermo intero · <b>r</b> reset rect<br>
  trascina un video o un'immagine sulla pagina per usarli come sorgente.<br>
  stato per frame in <code>window.emotionState</code> ed evento <code>emotionscript</code>.</p>
</aside>

<script type="module" src="js/app.js"></script>
</body>
</html>
